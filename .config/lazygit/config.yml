git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
  skipHookPrefix: "-"
os:
  editPreset: "nvim-remote"
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})' # allows edit to open neovim without a tab in the existing session
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
gui:
  showFileTree: false
  nerdFontsVersion: "3"
keybinding:
  universal:
    quit-alt1: "<esc>" # alternative/alias of quit
