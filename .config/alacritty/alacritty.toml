import = ["~/.config/alacritty/themes/gruvchad.toml"]	

# From https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
dynamic_padding = false
startup_mode = "Maximized"
option_as_alt = "OnlyRight"
padding = { x = 12, y = 12 }
dimensions = { columns = 120, lines = 40 }

[font]
normal = { family = "Maple Mono NF", style = "Medium" }
italic = { family = "Maple Mono NF", style = "Medium Italic" }
bold = { family = "Maple Mono NF", style = "Heavy" }
bold_italic = { family = "Maple Mono NF", style = "Heavy Italic" }
size = 9.5


[keyboard]
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r" }]

