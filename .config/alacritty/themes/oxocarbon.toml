# Oxocarbon Color Scheme for Alacritty in TOML format
# Source: https://github.com/nyoom-engineering/oxocarbon-alacritty/pull/2/files

# Primary colors
[colors.primary]
background = '#000000'
foreground = '#ffffff'

[colors.cursor]
text = "#000000"
foreground = '#ffffff'

# Normal colors
[colors.normal]
black = "#262626"
magenta = "#ff7eb6"
green = "#42be65"
yellow = "#ffe97b"
blue = "#33b1ff"
red = "#ee5396"
cyan = "#3ddbd9"
white = "#ffffff"

# Bright colors
[colors.bright]
black = "#393939"
magenta = "#ff7eb6"
green = "#42be65"
yellow = "#ffe97b"
blue = "#33b1ff"
red = "#ee5396"
cyan = "#3ddbd9"
white = "#ffffff"

